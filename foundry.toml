[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"  # must match the Besu genesis milestone (pragueTime)

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# Heavier run: FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 128

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
